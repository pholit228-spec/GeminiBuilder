name: Build Geode mod
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.target }}
  package:
    name: Combine packages
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiBuilder-geode
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
